<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Навигатор РТУ МИРЭА · В-78</title>

	<!-- Viewport for Responsivity -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="description" content="Маршруты между аудиториями главного корпуса РТУ МИРЭА на проспекте Вернадского, 78">
	<meta name="theme-color" content="#102a43">

	<!-- Stylesheets -->
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<link rel="stylesheet" type="text/css" href="css/map.css">
	<link rel="stylesheet" type="text/css" href="mapplic/mapplic.css">
	<link rel="stylesheet" type="text/css" href="mapplic-routes/css/mapplic-routes.css">
	<!-- Internet Explorer -->
		<!--[if lt IE 9]>
			<link rel="stylesheet" type="text/css" href="mapplic/mapplic-ie.css">
			<script type="text/javascript" src="js/html5shiv.js"></script>
		<![endif]-->
		</head>
		<body>
			<div id="wrap">
				<header id="header">
					<div class="brand-mark" aria-hidden="true">М</div>
					<div>
						<p class="eyebrow">РТУ МИРЭА · В-78</p>
						<h1>Маршрут по корпусу</h1>
					</div>
				</header>
				<section id="route-summary" class="route-summary" aria-live="polite">
					<div class="route-point">
						<span>Откуда</span>
						<strong id="route-from">Выбери точку на карте</strong>
					</div>
					<div class="route-arrow" aria-hidden="true">→</div>
					<div class="route-point">
						<span>Куда</span>
						<strong id="route-to">Выбери точку на карте</strong>
					</div>
					<p id="route-status" class="route-status">Укажи начало и конец маршрута</p>
				</section>

				<!-- Site content -->
				<div id="content">
					
					<section id="map-section" class="inner">
						<div class="editor-window">
							<div class="window-mockup brown"></div>
							<div class="editor-body">
						</div>
					</div>

					<!-- Map -->
						<div class="map-container">
							<div id="mapplic" class="mapplic-routes"></div>
						</div>

				</section>
			</div>
			<footer>
				Планы и маршрутный граф — студенческий проект
				<a href="https://github.com/KashCodeOriginal/MireaMap">MireaMap</a>.
				Обозначения аудиторий сверяются с официальным расписанием.
			</footer>
		</div>

		<!-- Scripts -->
		<script type="text/javascript" src="js/jquery.min.js"></script>
		<script type="text/javascript" src="js/jquery.mousewheel.js"></script>
		<script type="text/javascript" src="js/script.js"></script>
		<script type="text/javascript" src="js/magnific-popup.js"></script>
		<script type="text/javascript" src="mapplic/mapplic.js"></script>
		<script type="text/javascript" src="mapplic-routes/js/mapplic-routes.js"></script>

<script type="text/javascript">
			$(document).ready(function() {
				$('#mapplic').mapplic({
					source: 'mall-routes.json',
					height: 650,
					sidebar: true,
					thumbholder: true,
					maxscale: 4,
					routes: {
						accessible: true,
						opened: true,
						linecolor: 'rgba(242,53,67,0.6)',
						linewidth: 2,
						speed: 0.9
					}
				});
			});
		</script>

	</body>
	</html>
